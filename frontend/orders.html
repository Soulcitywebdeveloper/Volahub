<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders – VolaHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--green-50:#f0faf3;--green-100:#d1f0da;--green-200:#a3e0b6;--green-400:#3db065;--green-500:#2a9050;--green-600:#1f7a3e;--gray-50:#f8faf8;--gray-100:#eef2ee;--gray-200:#d4ddd4;--gray-400:#8a9e8a;--gray-600:#4a5e4a;--gray-800:#1e281e;--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6;--font-display:'Syne',sans-serif;--font-body:'Plus Jakarta Sans',sans-serif;--radius:12px;--radius-lg:20px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--gray-50);color:var(--gray-800);}
.navbar{background:white;border-bottom:1px solid var(--gray-100);padding:0 5%;}
.nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;}
.logo{font-family:var(--font-display);font-size:24px;font-weight:800;color:var(--green-600);text-decoration:none;}
.logo span{color:var(--green-400);}
.back-link{display:flex;align-items:center;gap:6px;color:var(--gray-600);text-decoration:none;font-size:14px;font-weight:600;}
.back-link:hover{color:var(--green-600);}
.main{max-width:900px;margin:0 auto;padding:40px 5%;}
.page-title{font-family:var(--font-display);font-size:26px;font-weight:800;margin-bottom:24px;letter-spacing:-.5px;}
.page-title span{color:var(--green-500);}

.order-card{background:white;border-radius:var(--radius-lg);border:1px solid var(--gray-100);margin-bottom:16px;overflow:hidden;transition:border-color .2s;}
.order-card:hover{border-color:var(--green-200);}
.order-top{padding:18px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;cursor:pointer;user-select:none;}
.order-meta{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.order-num{font-family:var(--font-display);font-size:15px;font-weight:800;color:var(--gray-800);}
.order-date{font-size:12px;color:var(--gray-400);}
.order-amount{font-family:var(--font-display);font-size:17px;font-weight:800;color:var(--green-600);}
.status-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
.status-badge.pending{background:#fef3c7;color:#d97706;}
.status-badge.confirmed,.status-badge.processing{background:#dbeafe;color:#1d4ed8;}
.status-badge.shipped{background:#ede9fe;color:#7c3aed;}
.status-badge.delivered{background:var(--green-100);color:var(--green-700);}
.status-badge.cancelled{background:#fee2e2;color:#b91c1c;}

.order-body{padding:0 22px;max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s;}
.order-body.open{max-height:600px;padding:0 22px 20px;}

/* TRACKER */
.tracker{display:flex;align-items:center;justify-content:space-between;padding:20px 0 24px;position:relative;}
.tracker::before{content:'';position:absolute;top:22px;left:16px;right:16px;height:3px;background:var(--gray-100);z-index:0;}
.tracker-fill{position:absolute;top:22px;left:16px;height:3px;background:var(--green-400);z-index:1;transition:width .5s;}
.track-step{display:flex;flex-direction:column;align-items:center;gap:6px;z-index:2;}
.track-dot{width:28px;height:28px;border-radius:50%;border:3px solid var(--gray-200);background:white;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .3s;}
.track-dot.done{border-color:var(--green-400);background:var(--green-400);color:white;}
.track-dot.active{border-color:var(--green-500);background:white;box-shadow:0 0 0 4px rgba(61,176,101,.15);}
.track-label{font-size:11px;font-weight:600;color:var(--gray-400);text-align:center;}
.track-label.done,.track-label.active{color:var(--green-600);}

/* ORDER ITEMS */
.order-items{border-top:1px solid var(--gray-100);padding-top:14px;}
.order-item{display:flex;align-items:center;gap:12px;padding:8px 0;}
.oi-img{width:44px;height:44px;border-radius:8px;background:var(--gray-50);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden;}
.oi-img img{width:100%;height:100%;object-fit:cover;border-radius:8px;}
.oi-name{font-size:13px;font-weight:600;flex:1;}
.oi-qty{font-size:12px;color:var(--gray-400);}
.oi-price{font-size:13px;font-weight:700;color:var(--green-600);}

.loader{width:28px;height:28px;border:3px solid var(--green-100);border-top-color:var(--green-500);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty-state{text-align:center;padding:80px 20px;color:var(--gray-400);}
.empty-state .icon{font-size:48px;margin-bottom:16px;}
.empty-state h3{font-size:18px;font-weight:700;margin-bottom:8px;}
.btn-shop{padding:12px 28px;background:var(--green-500);color:white;border:none;border-radius:var(--radius);font-family:var(--font-body);font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;margin-top:16px;}
.btn-shop:hover{background:var(--green-600);}
</style>
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a class="logo" href="index.html">Vola<span>Hub</span></a>
    <a class="back-link" href="index.html">← Continue Shopping</a>
  </div>
</nav>

<div class="main">
  <h1 class="page-title">My <span>Orders</span></h1>
  <div id="ordersContainer"><div class="loader"></div></div>
</div>

<script>
const API = 'https://volahub.onrender.com/api';
let token = localStorage.getItem('volahub_token') || '';
let currentUser = JSON.parse(localStorage.getItem('volahub_user') || 'null');

if (!currentUser) window.location.href = 'index.html';

const statusSteps = ['pending','confirmed','processing','shipped','delivered'];
const statusEmojis = { pending:'⏳', confirmed:'✅', processing:'⚙️', shipped:'🚚', delivered:'📦', cancelled:'❌' };

function getStepIndex(status) { return statusSteps.indexOf(status); }

function renderTracker(status) {
  if (status === 'cancelled') return `<div style="text-align:center;color:#b91c1c;font-weight:700;padding:16px 0;font-size:14px;">❌ This order was cancelled</div>`;
  const current = getStepIndex(status);
  const pct = current < 0 ? 0 : (current / (statusSteps.length - 1)) * 100;
  const steps = statusSteps.map((s, i) => {
    const cls = i < current ? 'done' : i === current ? 'active' : '';
    const check = i < current ? '✓' : statusEmojis[s] || (i+1);
    return `<div class="track-step">
      <div class="track-dot ${cls}">${check}</div>
      <div class="track-label ${cls}">${s.charAt(0).toUpperCase()+s.slice(1)}</div>
    </div>`;
  }).join('');
  return `<div class="tracker">${steps}<div class="tracker-fill" style="width:calc(${pct}% - 32px)"></div></div>`;
}

async function loadOrders() {
  const res = await fetch(`${API}/orders/my-orders`, { headers: { Authorization: `Bearer ${token}` } });
  const data = await res.json();
  const container = document.getElementById('ordersContainer');

  if (!data.success || !data.data.length) {
    container.innerHTML = `<div class="empty-state">
      <div class="icon">🛍️</div>
      <h3>No orders yet</h3>
      <p>Start shopping and your orders will appear here</p>
      <a class="btn-shop" href="index.html">Shop Now →</a>
    </div>`;
    return;
  }

  container.innerHTML = data.data.map(order => {
    const date = new Date(order.createdAt).toLocaleDateString('en-NG', { day:'numeric', month:'long', year:'numeric' });
    const items = order.items.map(i => {
      const img = i.product?.images?.[0]?.url ? `<img src="http://localhost:5000${i.product.images[0].url}" alt="${i.name}">` : '📦';
      return `<div class="order-item"><div class="oi-img">${img}</div><div class="oi-name">${i.name}<div class="oi-qty">x${i.quantity}</div></div><div class="oi-price">₦${(i.price*i.quantity).toLocaleString()}</div></div>`;
    }).join('');

    return `<div class="order-card">
      <div class="order-top" onclick="toggleOrder('${order._id}')">
        <div class="order-meta">
          <div>
            <div class="order-num">#${order.orderNumber}</div>
            <div class="order-date">${date}</div>
          </div>
          <span class="status-badge ${order.status}">${statusEmojis[order.status]} ${order.status}</span>
        </div>
        <div class="order-amount">₦${order.pricing.total.toLocaleString()} <span style="font-size:14px;font-weight:400;color:var(--gray-400);margin-left:4px;">${order.items.length} item${order.items.length>1?'s':''}</span></div>
      </div>
      <div class="order-body" id="body-${order._id}">
        ${renderTracker(order.status)}
        <div class="order-items">${items}</div>
        <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--gray-100);display:flex;justify-content:space-between;font-size:13px;">
          <span style="color:var(--gray-400);">Delivered to: ${order.shippingAddress?.city || '-'}, ${order.shippingAddress?.state || '-'}</span>
          <span style="font-weight:600;">Payment: ${order.paymentMethod}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleOrder(id) {
  const body = document.getElementById(`body-${id}`);
  body.classList.toggle('open');
}

loadOrders();
</script>
</body>
</html>
