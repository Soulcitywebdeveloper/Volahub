<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders & Tracking – VolaHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  --g50:#f0faf3;--g100:#d1f0da;--g200:#a3e0b6;--g400:#3db065;--g500:#2a9050;--g600:#1f7a3e;--g700:#165c2e;--g900:#061f0f;
  --gray50:#f8faf8;--gray100:#eef2ee;--gray200:#d4ddd4;--gray400:#8a9e8a;--gray600:#4a5e4a;--gray800:#1e281e;
  --amber:#f59e0b;--red:#ef4444;--blue:#3b82f6;--purple:#7c3aed;
  --font-d:'Syne',sans-serif;--font-b:'Plus Jakarta Sans',sans-serif;
  --r:12px;--rl:20px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--font-b);background:var(--gray50);color:var(--gray800);}

/* NAV */
.navbar{background:white;border-bottom:1px solid var(--gray100);padding:0 5%;position:sticky;top:0;z-index:100;}
.nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;}
.logo{font-family:var(--font-d);font-size:24px;font-weight:800;color:var(--g600);text-decoration:none;}
.logo span{color:var(--g400);}
.nav-right{display:flex;align-items:center;gap:12px;}
.back-link{display:flex;align-items:center;gap:6px;color:var(--gray600);text-decoration:none;font-size:13px;font-weight:600;padding:7px 14px;border-radius:50px;border:1.5px solid var(--gray200);transition:all .2s;}
.back-link:hover{border-color:var(--g400);color:var(--g600);}

/* HERO STRIP */
.hero-strip{background:linear-gradient(135deg,var(--g700) 0%,var(--g500) 100%);padding:40px 5%;}
.hero-strip-inner{max-width:1100px;margin:0 auto;}
.hero-strip h1{font-family:var(--font-d);font-size:30px;font-weight:800;color:white;letter-spacing:-0.5px;margin-bottom:6px;}
.hero-strip p{color:rgba(255,255,255,.7);font-size:14px;}

/* MAIN */
.main{max-width:1100px;margin:0 auto;padding:32px 5%;}

/* TABS */
.tabs{display:flex;gap:4px;background:white;border:1px solid var(--gray100);border-radius:50px;padding:4px;margin-bottom:28px;width:fit-content;}
.tab{padding:8px 22px;border-radius:50px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;border:none;background:transparent;color:var(--gray600);font-family:var(--font-b);}
.tab.active{background:var(--g500);color:white;}
.tab:hover:not(.active){background:var(--g50);color:var(--g600);}

/* TRACK BOX */
.track-box{background:white;border-radius:var(--rl);border:1px solid var(--gray100);padding:28px 32px;margin-bottom:28px;}
.track-box h2{font-family:var(--font-d);font-size:18px;font-weight:800;margin-bottom:6px;}
.track-box p{font-size:13px;color:var(--gray400);margin-bottom:20px;}
.track-form{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-label{font-size:11px;font-weight:700;color:var(--gray600);text-transform:uppercase;letter-spacing:.4px;}
.form-input{padding:10px 14px;border:1.5px solid var(--gray200);border-radius:10px;font-family:var(--font-b);font-size:14px;outline:none;transition:border-color .2s;}
.form-input:focus{border-color:var(--g400);box-shadow:0 0 0 3px rgba(61,176,101,.1);}
.track-btn{padding:10px 24px;background:var(--g500);color:white;border:none;border-radius:10px;font-family:var(--font-b);font-size:14px;font-weight:700;cursor:pointer;transition:background .2s;white-space:nowrap;}
.track-btn:hover{background:var(--g600);}

/* ORDER RESULT */
.track-result{margin-top:24px;display:none;}
.track-result.show{display:block;}

/* ORDER CARD */
.order-card{background:white;border-radius:var(--rl);border:1px solid var(--gray100);margin-bottom:14px;overflow:hidden;transition:border-color .2s;}
.order-card:hover{border-color:var(--g200);}
.order-top{padding:18px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;cursor:pointer;user-select:none;}
.order-left{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.order-num{font-family:var(--font-d);font-size:15px;font-weight:800;}
.order-date{font-size:12px;color:var(--gray400);}
.order-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.order-amt{font-family:var(--font-d);font-size:17px;font-weight:800;color:var(--g600);}
.chevron{font-size:12px;color:var(--gray400);transition:transform .3s;}
.order-card.open .chevron{transform:rotate(180deg);}

/* STATUS BADGES */
.s-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
.s-pending{background:#fef3c7;color:#d97706;}
.s-confirmed,.s-processing{background:#dbeafe;color:#1d4ed8;}
.s-shipped{background:#ede9fe;color:var(--purple);}
.s-delivered{background:var(--g100);color:var(--g700);}
.s-cancelled{background:#fee2e2;color:#b91c1c;}

/* ORDER BODY */
.order-body{max-height:0;overflow:hidden;transition:max-height .4s ease;}
.order-card.open .order-body{max-height:900px;}
.order-body-inner{padding:0 22px 22px;}

/* PROGRESS TRACKER */
.progress-section{background:var(--g50);border-radius:var(--r);padding:20px 24px;margin-bottom:18px;}
.progress-title{font-size:12px;font-weight:700;color:var(--gray600);text-transform:uppercase;letter-spacing:.5px;margin-bottom:16px;}
.tracker{display:flex;align-items:flex-start;justify-content:space-between;position:relative;}
.tracker-line{position:absolute;top:14px;left:14px;right:14px;height:3px;background:var(--gray200);z-index:0;}
.tracker-fill{position:absolute;top:14px;left:14px;height:3px;background:var(--g400);z-index:1;transition:width .6s ease;}
.track-step{display:flex;flex-direction:column;align-items:center;gap:8px;z-index:2;flex:1;}
.track-dot{width:28px;height:28px;border-radius:50%;border:3px solid var(--gray200);background:white;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .3s;}
.track-dot.done{border-color:var(--g400);background:var(--g400);color:white;}
.track-dot.active{border-color:var(--g500);background:white;box-shadow:0 0 0 4px rgba(42,144,80,.15);}
.track-label{font-size:10px;font-weight:600;color:var(--gray400);text-align:center;text-transform:uppercase;letter-spacing:.3px;line-height:1.3;}
.track-label.done,.track-label.active{color:var(--g600);}
.track-time{font-size:10px;color:var(--gray400);text-align:center;margin-top:2px;}

/* DETAIL GRID */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
.detail-box{background:var(--gray50);border-radius:10px;padding:14px 16px;}
.detail-label{font-size:11px;font-weight:700;color:var(--gray400);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
.detail-val{font-size:13px;font-weight:600;color:var(--gray800);line-height:1.5;}
.detail-val small{color:var(--gray400);font-weight:400;}

/* ITEMS TABLE */
.items-section{margin-bottom:16px;}
.items-title{font-size:12px;font-weight:700;color:var(--gray600);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.order-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--gray100);}
.order-item:last-child{border-bottom:none;}
.oi-img{width:48px;height:48px;border-radius:8px;background:var(--gray50);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden;}
.oi-img img{width:100%;height:100%;object-fit:cover;border-radius:8px;}
.oi-info{flex:1;}
.oi-name{font-size:13px;font-weight:600;}
.oi-qty{font-size:12px;color:var(--gray400);}
.oi-price{font-size:13px;font-weight:700;color:var(--g600);text-align:right;}

/* TOTALS */
.totals-box{background:var(--g50);border-radius:10px;padding:14px 16px;}
.tot-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--gray600);}
.tot-row.total{font-size:16px;font-weight:800;color:var(--gray800);border-top:1.5px solid var(--g200);padding-top:10px;margin-top:6px;}

/* STATUS HISTORY */
.history-section{margin-top:16px;}
.history-title{font-size:12px;font-weight:700;color:var(--gray600);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.history-item{display:flex;gap:12px;padding:8px 0;border-left:2px solid var(--gray200);padding-left:16px;margin-left:6px;position:relative;}
.history-item::before{content:'';position:absolute;left:-5px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--gray200);}
.history-item.latest{border-left-color:var(--g400);}
.history-item.latest::before{background:var(--g400);}
.history-status{font-size:12px;font-weight:700;color:var(--gray800);}
.history-note{font-size:12px;color:var(--gray400);}
.history-time{font-size:11px;color:var(--gray400);margin-left:auto;white-space:nowrap;}

/* EMPTY/LOADER */
.loader{width:28px;height:28px;border:3px solid var(--g100);border-top-color:var(--g500);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty-state{text-align:center;padding:80px 20px;}
.empty-state .icon{font-size:56px;margin-bottom:16px;}
.empty-state h3{font-family:var(--font-d);font-size:20px;font-weight:800;margin-bottom:8px;}
.empty-state p{font-size:14px;color:var(--gray400);margin-bottom:20px;}
.btn-shop{padding:12px 28px;background:var(--g500);color:white;border:none;border-radius:50px;font-family:var(--font-b);font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;transition:background .2s;}
.btn-shop:hover{background:var(--g600);}

/* ERROR */
.error-box{background:#fee2e2;border:1.5px solid #fca5a5;border-radius:10px;padding:14px 18px;color:#b91c1c;font-size:13px;font-weight:600;margin-top:16px;display:none;}
.error-box.show{display:block;}

/* TOAST */
.toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--gray800);color:white;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,.3);transform:translateX(120px);opacity:0;transition:all .3s;}
.toast.show{transform:translateX(0);opacity:1;}

@media(max-width:640px){
  .track-form{grid-template-columns:1fr;}
  .detail-grid{grid-template-columns:1fr;}
  .tabs{width:100%;}
  .tab{flex:1;text-align:center;}
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a class="logo" href="index.html">Vola<span>Hub</span></a>
    <div class="nav-right">
      <a class="back-link" href="index.html">← Continue Shopping</a>
    </div>
  </div>
</nav>

<div class="hero-strip">
  <div class="hero-strip-inner">
    <h1>Orders & Tracking</h1>
    <p>View your order history and track deliveries in real-time</p>
  </div>
</div>

<div class="main">

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('myorders', this)">📦 My Orders</button>
    <button class="tab" onclick="switchTab('track', this)">🔍 Track an Order</button>
  </div>

  <!-- MY ORDERS TAB -->
  <div id="tab-myorders">
    <div id="ordersContainer"><div class="loader"></div></div>
  </div>

  <!-- TRACK AN ORDER TAB -->
  <div id="tab-track" style="display:none;">
    <div class="track-box">
      <h2>🔍 Track Your Order</h2>
      <p>Enter your order number and email address to get real-time delivery updates.</p>
      <div class="track-form">
        <div class="form-group">
          <label class="form-label">Order Number</label>
          <input type="text" class="form-input" id="trackOrderNum" placeholder="e.g. VH-1234567890-0001">
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-input" id="trackEmail" placeholder="email used when ordering">
        </div>
        <button class="track-btn" onclick="trackOrder()">Track →</button>
      </div>
      <div class="error-box" id="trackError"></div>
      <div class="track-result" id="trackResult"></div>
    </div>
  </div>

</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const API = 'https://volahub-api.onrender.com/api';
let token = localStorage.getItem('volahub_token') || '';
let currentUser = JSON.parse(localStorage.getItem('volahub_user') || 'null');

const statusSteps = ['pending','confirmed','processing','shipped','delivered'];
const statusEmoji = {pending:'⏳',confirmed:'✅',processing:'⚙️',shipped:'🚚',delivered:'📦',cancelled:'❌'};
const statusLabel = {pending:'Placed',confirmed:'Confirmed',processing:'Processing',shipped:'Shipped',delivered:'Delivered'};

// ===== TAB SWITCHING =====
function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-myorders').style.display = tab === 'myorders' ? 'block' : 'none';
  document.getElementById('tab-track').style.display = tab === 'track' ? 'block' : 'none';
}

// ===== TRACKER RENDERER =====
function renderTracker(status, statusHistory) {
  if (status === 'cancelled') {
    return `<div style="text-align:center;padding:14px;color:#b91c1c;font-weight:700;font-size:14px;">❌ This order was cancelled</div>`;
  }
  const currentIdx = statusSteps.indexOf(status);
  const pct = currentIdx <= 0 ? 0 : (currentIdx / (statusSteps.length - 1)) * 100;
  const fillWidth = `calc(${pct}% - 28px)`;

  const getTime = (s) => {
    const entry = statusHistory?.find(h => h.status === s);
    if (!entry) return '';
    return new Date(entry.timestamp).toLocaleDateString('en-NG', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  };

  return `
    <div class="progress-section">
      <div class="progress-title">Delivery Progress</div>
      <div class="tracker">
        <div class="tracker-line"></div>
        <div class="tracker-fill" style="width:${fillWidth}"></div>
        ${statusSteps.map((s, i) => {
          const done = i < currentIdx;
          const active = i === currentIdx;
          const cls = done ? 'done' : active ? 'active' : '';
          const dot = done ? '✓' : statusEmoji[s];
          return `<div class="track-step">
            <div class="track-dot ${cls}">${dot}</div>
            <div class="track-label ${cls}">${statusLabel[s]}</div>
            <div class="track-time">${getTime(s)}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

// ===== ORDER CARD RENDERER =====
function renderOrderCard(order, expanded = false) {
  const date = new Date(order.createdAt).toLocaleDateString('en-NG', {day:'numeric',month:'long',year:'numeric'});
  const addr = order.shippingAddress || {};

  const items = order.items.map(i => {
    const img = i.product?.images?.[0]?.url
      ? `<img src="${API.replace('/api','')}/uploads/products/${i.product.images[0].url.split('/').pop()}" alt="${i.name}" onerror="this.style.display='none'">`
      : '📦';
    return `<div class="order-item">
      <div class="oi-img">${img}</div>
      <div class="oi-info">
        <div class="oi-name">${i.name}</div>
        <div class="oi-qty">× ${i.quantity} · ₦${Number(i.price).toLocaleString()} each</div>
      </div>
      <div class="oi-price">₦${Number(i.price * i.quantity).toLocaleString()}</div>
    </div>`;
  }).join('');

  const history = (order.statusHistory || []).slice().reverse().map((h, idx) => `
    <div class="history-item ${idx === 0 ? 'latest' : ''}">
      <div>
        <div class="history-status">${statusEmoji[h.status] || '📋'} ${h.status.charAt(0).toUpperCase() + h.status.slice(1)}</div>
        ${h.note ? `<div class="history-note">${h.note}</div>` : ''}
      </div>
      <div class="history-time">${new Date(h.timestamp).toLocaleDateString('en-NG',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
    </div>`).join('');

  return `
    <div class="order-card ${expanded ? 'open' : ''}" id="card-${order._id}">
      <div class="order-top" onclick="toggleCard('${order._id}')">
        <div class="order-left">
          <div>
            <div class="order-num">#${order.orderNumber}</div>
            <div class="order-date">${date} · ${order.items.length} item${order.items.length>1?'s':''}</div>
          </div>
          <span class="s-badge s-${order.status}">${statusEmoji[order.status]} ${order.status}</span>
        </div>
        <div class="order-right">
          <div class="order-amt">₦${Number(order.pricing.total).toLocaleString()}</div>
          <span class="chevron">▼</span>
        </div>
      </div>
      <div class="order-body">
        <div class="order-body-inner">

          ${renderTracker(order.status, order.statusHistory)}

          <div class="detail-grid">
            <div class="detail-box">
              <div class="detail-label">📍 Delivering To</div>
              <div class="detail-val">
                <strong>${addr.fullName || currentUser?.name || '-'}</strong><br>
                ${addr.street || ''}<br>
                ${addr.city || ''}, ${addr.state || ''}<br>
                <small>${addr.phone || ''}</small>
              </div>
            </div>
            <div class="detail-box">
              <div class="detail-label">💳 Payment</div>
              <div class="detail-val">
                ${order.paymentMethod?.charAt(0).toUpperCase() + order.paymentMethod?.slice(1) || '-'}<br>
                <span class="s-badge s-${order.paymentStatus}" style="margin-top:4px;display:inline-block;">${order.paymentStatus}</span>
              </div>
            </div>
          </div>

          <div class="items-section">
            <div class="items-title">Order Items</div>
            ${items}
          </div>

          <div class="totals-box">
            <div class="tot-row"><span>Subtotal</span><span>₦${Number(order.pricing.subtotal).toLocaleString()}</span></div>
            <div class="tot-row"><span>Shipping</span><span>${order.pricing.shipping === 0 ? '<span style="color:var(--g500);font-weight:700;">FREE</span>' : '₦' + Number(order.pricing.shipping).toLocaleString()}</span></div>
            <div class="tot-row"><span>VAT (7.5%)</span><span>₦${Number(order.pricing.tax).toLocaleString()}</span></div>
            <div class="tot-row total"><span>Total</span><span>₦${Number(order.pricing.total).toLocaleString()}</span></div>
          </div>

          ${order.statusHistory?.length ? `
          <div class="history-section">
            <div class="history-title">Status History</div>
            ${history}
          </div>` : ''}

        </div>
      </div>
    </div>`;
}

function toggleCard(id) {
  document.getElementById(`card-${id}`)?.classList.toggle('open');
}

// ===== LOAD MY ORDERS =====
async function loadMyOrders() {
  const container = document.getElementById('ordersContainer');

  if (!currentUser) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">🔐</div>
        <h3>Sign in to view your orders</h3>
        <p>You need to be logged in to see your order history and track deliveries.</p>
        <a class="btn-shop" href="index.html">Go to Store →</a>
      </div>`;
    return;
  }

  try {
    const res = await fetch(`${API}/orders/my-orders`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    const data = await res.json();

    if (!data.success || !data.data.length) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="icon">🛍️</div>
          <h3>No orders yet</h3>
          <p>You haven't placed any orders. Start shopping to see your orders here!</p>
          <a class="btn-shop" href="index.html">Shop Now →</a>
        </div>`;
      return;
    }

    container.innerHTML = data.data.map((o, i) => renderOrderCard(o, i === 0)).join('');
  } catch (err) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">⚠️</div>
        <h3>Could not load orders</h3>
        <p>Please check your connection and try again.</p>
        <button class="btn-shop" onclick="loadMyOrders()">Retry</button>
      </div>`;
  }
}

// ===== TRACK ORDER (public) =====
async function trackOrder() {
  const orderNum = document.getElementById('trackOrderNum').value.trim();
  const email = document.getElementById('trackEmail').value.trim();
  const errorBox = document.getElementById('trackError');
  const resultBox = document.getElementById('trackResult');

  errorBox.classList.remove('show');
  resultBox.classList.remove('show');
  resultBox.innerHTML = '';

  if (!orderNum || !email) {
    errorBox.textContent = 'Please enter both your order number and email address.';
    errorBox.classList.add('show');
    return;
  }

  const btn = document.querySelector('.track-btn');
  btn.textContent = 'Tracking...';
  btn.disabled = true;

  try {
    const res = await fetch(`${API}/orders/track`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orderNumber: orderNum, email })
    });
    const data = await res.json();

    if (data.success) {
      resultBox.innerHTML = renderOrderCard(data.data, true);
      resultBox.classList.add('show');
      resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } else {
      errorBox.textContent = data.message || 'Order not found. Please check your details.';
      errorBox.classList.add('show');
    }
  } catch (err) {
    errorBox.textContent = 'Network error. Please try again.';
    errorBox.classList.add('show');
  } finally {
    btn.textContent = 'Track →';
    btn.disabled = false;
  }
}

// Allow Enter key on track inputs
['trackOrderNum','trackEmail'].forEach(id => {
  document.getElementById(id)?.addEventListener('keypress', e => {
    if (e.key === 'Enter') trackOrder();
  });
});

// ===== INIT =====
loadMyOrders();

// Check if came from checkout with order num in URL
const params = new URLSearchParams(window.location.search);
if (params.get('track')) {
  switchTab('track', document.querySelectorAll('.tab')[1]);
  document.getElementById('trackOrderNum').value = params.get('track');
  if (params.get('email')) {
    document.getElementById('trackEmail').value = params.get('email');
    trackOrder();
  }
}
</script>
